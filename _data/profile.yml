bio: >
  Seonghyeon Cho is an M.S. student in the
  [School of Software at Soongsil University](https://sw.ssu.ac.kr/), where he is a member of the
  [Natural Language Processing Lab](https://sites.google.com/view/ssu-nlp/home)
  advised by Prof. [Chanjun Park](https://parkchanjun.github.io/).
  He received his B.S. in School of Software from Soongsil University, and worked as an
  undergraduate researcher in the same lab before starting his M.S.
  His research centers on improving the actual performance of models through model
  interpretability, and on investigating and reducing the intent gap — the gaps that arise
  between what users intend, what models produce, and what actually happens inside models.
  His lifelong goal is to make AI something that everyone can use easily and well, by studying
  its most fundamental principles and carrying those insights through to real-world applications.
  For more details, please see his [CV](./cv.pdf).
